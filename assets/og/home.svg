<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0D0D0D"/>
  <!-- Red block left -->
  <rect x="0" y="0" width="18" height="630" fill="#D62828"/>
  <!-- Yellow top band -->
  <rect x="18" y="0" width="1182" height="8" fill="#F5C400"/>
  <!-- Blue geometric accent -->
  <rect x="880" y="340" width="280" height="280" fill="#1A3EBF" opacity="0.18"/>
  <rect x="960" y="260" width="180" height="180" fill="#1A3EBF" opacity="0.22"/>
  <!-- Red square accent -->
  <rect x="1060" y="160" width="100" height="100" fill="#D62828" opacity="0.55"/>
  <!-- Yellow dot -->
  <circle cx="1110" cy="110" r="28" fill="#F5C400" opacity="0.7"/>
  <!-- PRYMM GROUP wordmark -->
  <text x="80" y="108" font-family="Arial Narrow, Arial, sans-serif" font-weight="900" font-size="22" letter-spacing="10" fill="#F5C400" text-anchor="start">PRYMM GROUP</text>
  <!-- Divider -->
  <rect x="80" y="130" width="120" height="3" fill="#D62828"/>
  <!-- Main headline -->
  <text x="80" y="280" font-family="Arial Narrow, Arial, sans-serif" font-weight="900" font-size="96" letter-spacing="-2" fill="#F7F5F0" text-anchor="start">THE</text>
  <text x="80" y="390" font-family="Arial Narrow, Arial, sans-serif" font-weight="900" font-size="96" letter-spacing="-2" fill="#F7F5F0" text-anchor="start">PRYMM</text>
  <text x="80" y="500" font-family="Arial Narrow, Arial, sans-serif" font-weight="900" font-size="96" letter-spacing="-2" fill="#D62828" text-anchor="start">GROUP</text>
  <!-- Tagline -->
  <text x="80" y="568" font-family="Arial, sans-serif" font-weight="400" font-size="22" fill="#888888" text-anchor="start">Engineering Solutions Across Five Divisions</text>
  <!-- Bottom bar -->
  <rect x="0" y="622" width="1200" height="8" fill="#D62828"/>
</svg>